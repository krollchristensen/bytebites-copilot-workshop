name: .NET check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Installér .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Gendan afhængigheder
        run: dotnet restore

      - name: Byg
        run: dotnet build --no-restore --configuration Release

      - name: Kør smoke test
        run: printf '0\n' | timeout 10 dotnet run --no-build --configuration Release
